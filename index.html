<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WODSTAR COMPETENCIAS</title>

<style>
body{
  background:black;
  color:white;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

h1{color:gold;}

#lista{
  width:100%;
  max-width:400px;
}

.competencia{
  background:#111;
  margin:10px;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.competencia div{
  cursor:pointer;
  margin-bottom:10px;
}

button{
  padding:10px;
  background:gold;
  border:none;
  cursor:pointer;
  border-radius:5px;
}

/* MODAL */
.modal-bg{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal{
  background:#111;
  padding:20px;
  border-radius:10px;
  max-width:400px;
  width:90%;
}

input,select{
  padding:10px;
  width:90%;
  border-radius:5px;
  border:none;
}

/* WHATSAPP */
#chatBox{
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  max-height:400px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:9999;
}

.mensaje-wa{
  display:flex;
  align-items:flex-end;
  gap:8px;
  opacity:0;
  transform:translateY(20px);
  transition:all 0.4s ease;
}

.mensaje-wa.show{
  opacity:1;
  transform:translateY(0);
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  background:gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:black;
}

.burbuja{
  background:#1f2c34;
  color:white;
  padding:10px 12px;
  border-radius:10px;
  max-width:200px;
  font-size:0.85rem;
  position:relative;
}

.burbuja::after{
  content:"";
  position:absolute;
  left:-6px;
  bottom:5px;
  width:10px;
  height:10px;
  background:#1f2c34;
  transform:rotate(45deg);
}

.burbuja a{
  color:#4fc3f7;
  text-decoration:underline;
}

.hora{
  font-size:0.7rem;
  color:#aaa;
  margin-top:5px;
  text-align:right;
}
</style>
</head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6600">

<body>

<h1>WODSTARS COMPETENCIAS</h1>

<div id="lista"></div>
<div id="modal"></div>
<div id="chatBox"></div>

<script>

// COMPETENCIAS
const competencias = [
  {
    nombre:"Competencia Enero",
    archivo:"competencia1.html",
    banco:"BBVA",
    cuenta:"1234567890",
    clabe:"012345678901234567",
    costos:{
      "Principiante Hombre":"$400 MXN",
      "Principiante Mujer":"$400 MXN",
      "Intermedio Hombre":"$500 MXN",
      "Intermedio Mujer":"$500 MXN",
      "Avanzado Hombre":"$600 MXN",
      "Avanzado Mujer":"$600 MXN"
    }
  },
   {
    nombre:"Competencia ",
    archivo:"competencia2.html",
    banco:"BBVA",
    cuenta:"1234567890",
    clabe:"012345678901234567",
    costos:{
      "Principiante Hombre":"$400 MXN",
      "Principiante Mujer":"$400 MXN",
      "Intermedio Hombre":"$500 MXN",
      "Intermedio Mujer":"$500 MXN",
      "Avanzado Hombre":"$600 MXN",
      "Avanzado Mujer":"$600 MXN"
    }
  }

];
 
// RENDER
let html="";
competencias.forEach(c=>{
  html+=`
    <div class="competencia">
      <div onclick="location.href='${c.archivo}'">${c.nombre}</div>
      <button onclick='inscribir(${JSON.stringify(c)})'>INSCRIBIRSE</button>
    </div>
  `;
});
lista.innerHTML=html;

// INSCRIBIR
function inscribir(comp){
  modal.innerHTML=`
  <div class="modal-bg" onclick="cerrar()">
    <div class="modal" onclick="event.stopPropagation()">

      <h2>${comp.nombre}</h2>

      <input id="nombre" placeholder="Nombre completo"><br><br>

      <select id="categoria">
        <option>Principiante Hombre</option>
        <option>Principiante Mujer</option>
        <option>Intermedio Hombre</option>
        <option>Intermedio Mujer</option>
        <option>Avanzado Hombre</option>
        <option>Avanzado Mujer</option>
      </select><br><br>

      <button onclick='generarRegistro(${JSON.stringify(comp)})'>Continuar</button>

    </div>
  </div>`;
}

function cerrar(){ modal.innerHTML=""; }

// REGISTRO
function generarRegistro(comp){

  const nombre=document.getElementById("nombre").value;
  const categoria=document.getElementById("categoria").value;

  if(!nombre) return alert("Ingresa tu nombre");

  const monto = comp.costos?.[categoria] ?? "No definido";
  const tiempoFinal = Date.now()+15*60*1000;

  localStorage.setItem("registro",JSON.stringify({
    nombre,categoria,
    competencia:comp.nombre,
    banco:comp.banco,
    cuenta:comp.cuenta,
    clabe:comp.clabe,
    monto,tiempoFinal
  }));

  mostrarRegistro();
}

// MOSTRAR REGISTRO
function mostrarRegistro(){
  const data=JSON.parse(localStorage.getItem("registro"));
  if(!data)return;

  modal.innerHTML=`
  <div class="modal-bg">
    <div class="modal">

      <h2>Pre-registro</h2>
      <p><b>${data.nombre}</b></p>
      <p>${data.competencia}</p>
      <p>${data.categoria}</p>

      <hr>

      <h3>Transferencia</h3>
      <p>Banco: ${data.banco}</p>
      <p>Cuenta: ${data.cuenta}</p>
      <p>CLABE: ${data.clabe}</p>
      <p>Monto: ${data.monto}</p>

      <p id="timer"></p>

      <button onclick="enviarCorreo('${data.nombre}','${data.categoria}','${data.competencia}')">
        Enviar comprobante
      </button>

      <br><br>
      <button onclick="cancelar()">Cancelar</button>

    </div>
  </div>`;

  iniciarTimer(data.tiempoFinal);
}

// TIMER
function iniciarTimer(t){
  const i=setInterval(()=>{
    const r=t-Date.now();
    if(r<=0){
      clearInterval(i);
      timer.innerText="⛔ Expirado";
      localStorage.removeItem("registro");
      return;
    }
    let m=Math.floor(r/60000);
    let s=Math.floor((r%60000)/1000);
    timer.innerText=`Tiempo: ${m}:${s<10?"0":""}${s}`;
  },1000);
}

function cancelar(){
  localStorage.removeItem("registro");
  cerrar();
}

// CORREO
function enviarCorreo(n,c,comp){
  window.location.href=
  `mailto:wodstarssoporte@gmail.com?subject=Comprobante&body=Nombre:${n}%0ACategoria:${c}%0ACompetencia:${comp}`;
}

// WHATSAPP STYLE
const mensajesWA=[
  
 
  "📲 Síguenos: https://www.instagram.com/wodstarscores//",
  
  "📢 Responde esta encuesta y gana un descuento https://docs.google.com/forms/d/e/1FAIpQLSc4VS9NYqgB5hOnb7-PomnAQ77a-O_trD5M4FDhGe_3OlyMmQ/viewform?usp=header"
];

function hora(){
  let d=new Date();
  return d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes();
}

function mostrarMensajeWA(txt){

  const chat = document.getElementById("chatBox");

  // borrar mensaje anterior
  chat.innerHTML = "";

  const c = document.createElement("div");
  c.className = "mensaje-wa";

  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const t = txt.replace(urlRegex, u => {
    return `<a href="${u}" target="_blank">${u}</a>`;
  });

  c.innerHTML = `
    <div class="avatar">W</div>
    <div class="burbuja">
      ${t}
      <div class="hora">${hora()}</div>
    </div>
  `;

  chat.appendChild(c);

  setTimeout(() => {
    c.classList.add("show");
  }, 100);

  // desaparecer
  setTimeout(() => {
    c.classList.remove("show");

    setTimeout(() => {
      if (chat.contains(c)) {
        c.remove();
      }
    }, 400);

  }, 7000);
}

function iniciarChatWA(){
  function loop(){
    setTimeout(()=>{
      const m=mensajesWA[Math.floor(Math.random()*mensajesWA.length)];
      mostrarMensajeWA(m);
      loop();
    },Math.random()*15000+10000);
  }
  loop();
}

// INIT
window.onload=()=>{
  if(localStorage.getItem("registro")){
    mostrarRegistro();
  }
  iniciarChatWA();
};

  <button id="installBtn" style="display:none">
    📲 Instalar WodStars
</button>

  let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();

    deferredPrompt = e;

    document.getElementById('installBtn').style.display = 'block';
});

document.getElementById('installBtn').addEventListener('click', async () => {

    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;

    console.log(result.outcome);

    deferredPrompt = null;
});
</script>

</body>
</html>
