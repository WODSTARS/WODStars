
<!DOCTYPE html>
<html lang="es">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WODStar Scores</title>

  <style>
    :root {
      --primary: #0f172a;
      --accent: #38bdf8;
      --light: #f1f5f9;
      --dark: #1e293b;
    }

    body {
      background: var(--primary);
      color: var(--light);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      margin-bottom: 1rem;
      color: var(--accent);
    }

    select, button {
      padding: 0.6rem;
      margin: 0.5rem;
      border-radius: 0.5rem;
      border: none;
      font-size: 1rem;
    }

    table {
      width: 100%;
      max-width: 900px;
      margin-top: 1rem;
      border-collapse: collapse;
      background: var(--dark);
      border-radius: 1rem;
      overflow: hidden;
    }

    th, td {
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid var(--primary);
    }

    tr:nth-child(even) {
      background: #334155;
    }

    tr:hover {
      background: #475569;
      cursor: pointer;
    }

    .category {
      margin-top: 2rem;
      color: var(--accent);
      font-size: 1.5rem;
    }

    .modal-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background: var(--dark);
      border-radius: 1rem;
      padding: 2rem;
      width: 90%;
      max-width: 500px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wod Star Scores</h1>

<select id="competenciaSelect">
  <option value="">Selecciona una categoria</option>

  <option value="principiante_hombre">Principiante Hombre</option>
  <option value="principiante_mujer">Principiante Mujer</option>

  <option value="intermedio_hombre">Intermedio Hombre</option>
  <option value="intermedio_mujer">Intermedio Mujer</option>

  <option value="avanzado_hombre">Avanzado Hombre</option>
  <option value="avanzado_mujer">Avanzado Mujer</option>
</select>

<button onclick="mostrarCompetencia()">Ingresar</button>

<div id="tablas"></div>
<div id="modalContainer"></div>

<script>
const datos = {
  pruebaIndividual: {
    ATLETAS: [

      {
        nombre: "LUIS RAMIREZ",
        categoria: "Principiante",
        rama: "Hombre",
        heat: "1",
        carril: "1",
        resultados: [
          { descripcion: "WOD 1", valor: "0 reps", puntos: 5 },
          { descripcion: "WOD 2", valor: "0 reps", puntos: 6 },
          { descripcion: "Final", valor: "0 reps", puntos: 7 }
        ]
      },

      {
        nombre: "ANA LOPEZ",
        categoria: "Intermedio",
        rama: "Mujer",
        heat: "2",
        carril: "2",
        resultados: [
          { descripcion: "WOD 1", valor: "0 reps", puntos: 8 },
          { descripcion: "WOD 2", valor: "0 reps", puntos: 9 },
          { descripcion: "Final", valor: "0 reps", puntos: 10 }
        ]
      },

      {
        nombre: "CARLOS MENDEZ",
        categoria: "Avanzado",
        rama: "Hombre",
        heat: "3",
        carril: "3",
        resultados: [
          { descripcion: "WOD 1", valor: "0 reps", puntos: 10 },
          { descripcion: "WOD 2", valor: "0 reps", puntos: 10 },
          { descripcion: "Final", valor: "0 reps", puntos: 10 }
        ]
      }

    ]
  }
};

const filtros = {
  principiante_hombre: { categoria: "Principiante", rama: "Hombre" },
  principiante_mujer: { categoria: "Principiante", rama: "Mujer" },

  intermedio_hombre: { categoria: "Intermedio", rama: "Hombre" },
  intermedio_mujer: { categoria: "Intermedio", rama: "Mujer" },

  avanzado_hombre: { categoria: "Avanzado", rama: "Hombre" },
  avanzado_mujer: { categoria: "Avanzado", rama: "Mujer" }
};

function mostrarCompetencia() {
  const seleccion = document.getElementById("competenciaSelect").value;
  const contenedor = document.getElementById("tablas");
  contenedor.innerHTML = "";

  const filtro = filtros[seleccion];
  if (!filtro) return;

  const atletas = datos.pruebaIndividual.ATLETAS;

  const filtrados = atletas.filter(a =>
    a.categoria === filtro.categoria &&
    a.rama === filtro.rama
  );

  let html = `<div class='category'>${filtro.categoria} - ${filtro.rama}</div>
  <table>
  <thead>
  <tr><th>#</th><th>Atleta</th><th>Total</th></tr>
  </thead><tbody>`;

  filtrados
    .map(a => ({ ...a, total: a.resultados.reduce((s, x) => s + x.puntos, 0) }))
    .sort((a, b) => b.total - a.total)
    .forEach((a, i) => {
      let lugar = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;
      html += `<tr onclick='verAtleta(${JSON.stringify(a)}, ${i})'>
      <td>${lugar}</td>
      <td>${a.nombre}</td>
      <td>${a.total}</td>
      </tr>`;
    });

  html += "</tbody></table>";
  contenedor.innerHTML = html;
}

function verAtleta(a, lugar) {
  if (lugar < 3) {
    confetti({
      particleCount: 100,
      spread: 70
    });
  }

  let html = `<div class="modal-bg" onclick="cerrarModal()">
  <div class="modal" onclick="event.stopPropagation()">
  <button class="close-btn" onclick="cerrarModal()">×</button>

  <h2>${a.nombre}</h2>
  <p><strong>Categoría:</strong> ${a.categoria}</p>
  <p><strong>Rama:</strong> ${a.rama}</p>
  <p><strong>Heat:</strong> ${a.heat}</p>
  <p><strong>Carril:</strong> ${a.carril}</p>`;

  a.resultados.forEach(r => {
    html += `<p>${r.descripcion}: ${r.valor} → ${r.puntos} pts</p>`;
  });

  html += `<p><strong>Total:</strong> ${a.resultados.reduce((s, x) => s + x.puntos, 0)}</p>
  </div></div>`;

  document.getElementById("modalContainer").innerHTML = html;
}

function cerrarModal() {
  document.getElementById("modalContainer").innerHTML = "";
}
</script>

</body>
</html>
