<title>WODStar Scores PRO</title>

<style>
:root{
  --primary:#000;
  --accent:#FFD700;
  --light:#f5f5f5;
  --dark:#111;
  --row:#1a1a1a;
}

html{
  background:#000;
}

/* CARGA INICIAL: no depende de librerias externas y funciona en GitHub Pages */
.app-loader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:grid;
  place-items:center;
  padding:24px;
  background:#050505;
  color:#f5f5f5;
  transition:opacity .35s ease, visibility .35s ease;
}

.app-loader.is-hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.app-loader__card{
  width:min(420px,100%);
  text-align:center;
}

.app-loader__mark{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
}

.app-loader__mark::before{
  content:"";
  position:absolute;
  inset:-8px;
  border:4px solid #2b2b2b;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:loaderSpin .9s linear infinite;
}

.app-loader__logo{
  width:96px;
  height:96px;
  object-fit:contain;
  filter:drop-shadow(0 0 14px rgba(255,215,0,.28));
  animation:loaderLogo 1.8s ease-in-out infinite;
}

.app-loader__title{
  color:var(--accent);
  font-size:1.35rem;
  font-weight:900;
  letter-spacing:.12em;
}

.app-loader__status{
  margin-top:8px;
  color:#b8b8b8;
  font-size:.95rem;
}

@keyframes loaderSpin{to{transform:rotate(360deg)}}
@keyframes loaderLogo{50%{transform:scale(1.05);filter:drop-shadow(0 0 22px rgba(255,215,0,.48))}}

@media(prefers-reduced-motion:reduce){
  .app-loader__mark::before,
  .app-loader__logo{animation:none}
}

.live-badge{
  align-items:center;
  gap:8px;
  width:max-content;
  margin:0 auto 12px;
  padding:7px 13px;
  border:1px solid #ff3b3b;
  border-radius:999px;
  background:#2a0808;
  color:#fff;
  font-size:.82rem;
  font-weight:900;
  letter-spacing:.12em;
  box-shadow:0 0 18px rgba(255,59,59,.28);
}

.live-badge[hidden]{display:none}

.live-badge__dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff3b3b;
  box-shadow:0 0 0 0 rgba(255,59,59,.7);
  animation:livePulse 1.5s infinite;
}

@keyframes livePulse{70%{box-shadow:0 0 0 8px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}

/* BASE */
body{

  color:var(--light);

  padding:2rem;

h1{

button{

button:hover{

/* TABLA */
table{

tr:hover{

/* 🥇🥈🥉 TOP 3 */
.gold{

/* GLOW ANIMADO */

/* CATEGORIA */

<body>
<div id="appLoader" class="app-loader" role="status" aria-live="polite" aria-label="Cargando resultados">
  <div class="app-loader__card">
    <div class="app-loader__mark" aria-hidden="true">
      <img class="app-loader__logo" src="wodstar-logo-transparent.png" alt="">
    </div>
    <div class="app-loader__title">WODSTAR SCORES</div>

  </div>

<div class="barra-instalar">
  <button id="btnInstalar" class="btn-instalar" type="button">⬇ Descargar app</button>
</div>
<div class="top-actions">
  <button onclick="volverCompetencias()">⬅ Competencias</button>
  <button onclick="refrescarPagina()">↻ Refrescar</button>
</div>

<section class="competencia-hero">
  <div id="liveBadge" class="live-badge" hidden aria-label="Competencia en vivo">
    <span class="live-badge__dot" aria-hidden="true"></span>
    <span>EN VIVO</span>
  </div>
  <h1>MOONLIGHT GAMES</h1>
  <div class="score-controls">
    <select id="competenciaSelect" class="category-select" onchange="mostrarCompetencia()">
      <option value="">Selecciona categoria</option>
      <option value="teens_mixto">Teens Mixto</option>
      <option value="novatos_hombre">Novatos Hombre</option>
      <option value="novatos_mujer">Novatos Mujer</option>

      <option value="principiante_mujer">Principiante Mujer</option>

    </select>
  </div>
</section>

  <a class="highlights-link" href="https://wodstars.github.io/wodstarshiglights/">Highlights</a>
  <button onclick="mostrarHeats()">Heats y Carriles</button>
  <button onclick="mostrarTablaRecords()">Records</button>
</div>

  <strong>Nueva versión disponible</strong>
  <button id="btnActualizar" type="button">Actualizar ahora</button>
</aside>

<script>

/* PWA: instalación, detección de versiones nuevas y actualización inmediata. */
let eventoInstalacion = null;
let serviceWorkerNuevo = null;
let recargandoPorActualizacion = false;
let versionDocumentoActual = null;

window.addEventListener("beforeinstallprompt", evento => {
  evento.preventDefault();
  eventoInstalacion = evento;
});

window.addEventListener("appinstalled", () => {
  eventoInstalacion = null;
  ocultarBotonInstalacion();
});

function esIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

function esModoApp(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function ocultarBotonInstalacion(){
  document.getElementById("btnInstalar")?.closest(".barra-instalar")?.remove();
}

function mostrarTutorialInstalacion(){
  const pasos = esIOS()
    ? `<li>Abre esta página en <strong>Safari</strong>.</li><li>Toca <strong>Compartir</strong>.</li><li>Selecciona <strong>Agregar a pantalla de inicio</strong> y después <strong>Agregar</strong>.</li>`
    : `<li>Abre el menú del navegador.</li><li>Elige <strong>Instalar aplicación</strong> o <strong>Agregar a pantalla principal</strong>.</li><li>Confirma tocando <strong>Instalar</strong>.</li>`;
  document.getElementById("modalContainer").innerHTML = `
    <div class="modal-bg" onclick="cerrarModal()">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloInstalar" onclick="event.stopPropagation()">
        <button class="close-btn" type="button" onclick="cerrarModal()">×</button>
        <h2 id="tituloInstalar">Instala WODSTARS</h2>
        <p class="instalar-descripcion">Ten acceso rápido desde tu pantalla de inicio, como cualquier otra app.</p>
        <ol class="pasos-instalacion">${pasos}</ol>
        <div class="acciones-instalacion"><button type="button" onclick="cerrarModal()">Entendido</button></div>
      </div>
    </div>`;
}

async function instalarApp(){
  if(esModoApp()){
    alert("WODSTARS ya está instalada en este dispositivo.");
    return;
  }
  if(eventoInstalacion){
    eventoInstalacion.prompt();
    await eventoInstalacion.userChoice;
    eventoInstalacion = null;
    return;
  }
  mostrarTutorialInstalacion();
}

function mostrarAvisoActualizacion(worker){
  serviceWorkerNuevo = worker;
  document.getElementById("avisoActualizacion")?.classList.add("visible");
}

async function comprobarVersionPublicada(){
  try{
    const respuesta = await fetch("./competencia2.html", {method:"HEAD",cache:"no-store"});
    const version = respuesta.headers.get("etag") || respuesta.headers.get("last-modified");
    if(!version) return;
    if(versionDocumentoActual && versionDocumentoActual !== version) mostrarAvisoActualizacion(null);
    versionDocumentoActual = version;
  }catch(error){
    // Sin Internet se conserva la página actual y no se muestra un aviso falso.
  }
}

async function registrarPWA(){
  if(!("serviceWorker" in navigator)) return;
  try{
    const registro = await navigator.serviceWorker.register("./service-worker.js", {scope:"./",updateViaCache:"none"});
    if(registro.waiting) mostrarAvisoActualizacion(registro.waiting);
    registro.update().catch(()=>{});
    comprobarVersionPublicada();
    registro.addEventListener("updatefound", () => {
      const worker = registro.installing;
      if(!worker) return;
      worker.addEventListener("statechange", () => {
        if(worker.state === "installed" && navigator.serviceWorker.controller) mostrarAvisoActualizacion(worker);
      });
    });
    document.addEventListener("visibilitychange", () => {
      if(document.visibilityState === "visible"){
        registro.update().catch(()=>{});
        comprobarVersionPublicada();
      }
    });
    setInterval(() => {
      registro.update().catch(()=>{});
      comprobarVersionPublicada();
    }, 5 * 60 * 1000);
  }catch(error){
    console.warn("No fue posible registrar la PWA:", error);
  }
}

navigator.serviceWorker?.addEventListener("controllerchange", () => {
  if(recargandoPorActualizacion) return;
  recargandoPorActualizacion = true;
  window.location.reload();
});

document.addEventListener("DOMContentLoaded", () => {
  const botonInstalar = document.getElementById("btnInstalar");
  botonInstalar?.addEventListener("click", instalarApp);
  if(esModoApp()) ocultarBotonInstalacion();
  document.getElementById("btnActualizar")?.addEventListener("click", () => {
    if(serviceWorkerNuevo) serviceWorkerNuevo.postMessage({type:"SKIP_WAITING"});
    else window.location.reload();
  });
  registrarPWA();
});

  a todos los visitantes el dia de la competencia.
*/
const MODO_EN_VIVO =false; 
//const MODO_EN_VIVO = true;
function aplicarModoEnVivo(){
  const badge = document.getElementById("liveBadge");
  if(!badge)return;
  badge.hidden = !MODO_EN_VIVO;
  document.body.classList.toggle("is-live", MODO_EN_VIVO);
}

function cerrarPantallaCarga(){
  const loader = document.getElementById("appLoader");
  if(!loader || loader.classList.contains("is-hidden"))return;
  requestAnimationFrame(()=>{
    loader.classList.add("is-hidden");
    setTimeout(()=>loader.remove(), 450);
  });
}

function cargarConfetiSinBloquear(){
  const script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js";
  script.async = true;
  document.head.appendChild(script);
}

function lanzarConfetiDesdeElemento(elemento, intensidad=100){
  if(typeof confetti!=="function")return;
  const rect = elemento?.getBoundingClientRect?.();
  const origen = rect ? {
    x:(rect.left + rect.width/2) / window.innerWidth,
    y:(rect.top + rect.height/2) / window.innerHeight
  } : {x:.5,y:.72};

  confetti({particleCount:intensidad, spread:75, origin:origen});
}

function buscarNombreRecord(nombre){
  return [...document.querySelectorAll("[data-record-name]")].find(el=>el.dataset.recordName===nombre);
}

function crearMensajeEmergente(titulo, mensaje, duracion=6500, opciones={}){
  const stack = document.getElementById("toastStack");
  if(!stack)return;

  const aviso = document.createElement("div");
  aviso.className = `toast-message${opciones.tipo==="record" ? " toast-record" : ""}`;
  aviso.innerHTML = `<span class="toast-title">${titulo}</span><p>${mensaje}</p>${opciones.accion ? `<span class="toast-hint">${opciones.accion}</span>` : ""}`;

  if(opciones.onClick){
    aviso.setAttribute("role","button");
    aviso.tabIndex = 0;
    aviso.addEventListener("click", opciones.onClick);
    aviso.addEventListener("keydown", (event)=>{
      if(event.key==="Enter" || event.key===" "){
        event.preventDefault();
        opciones.onClick();
      }
    });
  }

  stack.appendChild(aviso);

  if(opciones.confetti){
    const objetivo = opciones.confettiName ? buscarNombreRecord(opciones.confettiName) : aviso.querySelector(".toast-title");
    lanzarConfetiDesdeElemento(objetivo || aviso.querySelector(".toast-title"), 80);
  }

  setTimeout(()=>{
    aviso.classList.add("saliendo");
    setTimeout(()=>aviso.remove(), 350);
  }, duracion);
}

function segundosDesdeTiempo(valor){
  if(!valor)return null;
  const texto = String(valor).trim();
  const partes = texto.split(":").map(n=>Number(n));
  if(partes.some(n=>Number.isNaN(n)))return null;
  if(partes.length===2)return partes[0]*60 + partes[1];
  if(partes.length===3)return partes[0]*3600 + partes[1]*60 + partes[2];
  return null;
}

function numeroDesdePeso(valor){
  if(valor===undefined || valor===null)return null;
  const numero = Number(String(valor).replace(/[^0-9.]/g,""));
  return Number.isFinite(numero) && numero>0 ? numero : null;
}

function textoSeguro(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function nombreAtletaMarkup(atleta, extraHtml=""){
  const nombre = textoSeguro(atleta.nombre);
  const dataName = textoSeguro(atleta.nombre);
  return `<span class="record-name" data-record-name="${dataName}">${nombre}${extraHtml}</span>`;
}

function actualizarContadorFoto(){
  const elemento = document.getElementById("photoDeadline");
  if(!elemento)return;

  const fechaLimite = new Date("2026-07-15T23:59:59");

  function pintar(){
    const restante = fechaLimite.getTime() - Date.now();
    if(restante <= 0){
      elemento.textContent = "La fecha límite para enviar foto fue el 15 de julio de 2026.";
      return;
    }

    const dias = Math.floor(restante / 86400000);
    const horas = Math.floor((restante % 86400000) / 3600000);
    const minutos = Math.floor((restante % 3600000) / 60000);
    elemento.textContent = `Fecha límite: 15 de julio de 2026. Quedan ${dias} días, ${horas} horas y ${minutos} minutos.`;
  }

  pintar();
  clearInterval(window.photoDeadlineTimer);
  window.photoDeadlineTimer = setInterval(pintar, 60000);
}

function obtenerRecords(){
  const records = [];

  datos.pruebaIndividual.ATLETAS.forEach(atleta=>{
    const clean = atleta.resultados.find(resultado=>resultado.wod==="WOD 2");
    if(!clean)return;

    const peso = numeroDesdePeso(clean.peso);
    if(peso===null)return;

    records.push({atleta, resultado:clean, marca:peso});
  });

  return records.sort((a,b)=>b.marca-a.marca).slice(0,3);
}

function obtenerRecordDestacado(records){
  const record = records[0];
  if(!record)return null;

  return {
    titulo:"Record Clean RM",
    mensaje:`${record.atleta.nombre} tiene el Clean mas alto con ${record.marca} lb.`,
    record
  };
}

function atletaTieneRecord(atleta, records){
  return Boolean(records[0] && records[0].atleta.nombre===atleta.nombre);
}

function filaRecord(record, index){
  const lugar = index===0 ? "1" : index===1 ? "2" : "3";
  const badge = index===0 ? ` <span class="record-badge">🏆 RECORD</span>` : "";

  return `<tr>
    <td><strong>${lugar}</strong></td>
    <td>${nombreAtletaMarkup(record.atleta, badge)}</td>
    <td>${textoSeguro(record.atleta.categoria)} ${textoSeguro(record.atleta.rama)}</td>
    <td><strong>${textoSeguro(record.marca)} lb</strong></td>
  </tr>`;
}

function renderRecordsClean(){
  const records = obtenerRecords();
  const contenedor = document.getElementById("recordsContent");
  if(!contenedor)return;

  const filas = records.map((record,index)=>filaRecord(record,index)).join("");

  contenedor.innerHTML = `<div class="records-card">
    <h3>Clean RM</h3>
    <p class="records-rule">Top 3 atletas que mas libras levantaron en Clean, tomando todas las categorias.</p>
    ${filas ? `<table class="records-table"><tr><th>#</th><th>Atleta</th><th>Categoria</th><th>Libras</th></tr>${filas}</table>` : `<p class="records-empty">Todavia no hay libras registradas en Clean.</p>`}
  </div>`;

  if(records[0]){
    setTimeout(()=>lanzarConfetiDesdeElemento(contenedor.querySelector(".record-name"), 130), 80);
  }
}

function mostrarTablaRecords(){
  document.getElementById("modalContainer").innerHTML = `
    <div class="modal-bg" onclick="cerrarModal()">
      <div class="modal grande records-panel" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="cerrarModal()">×</button>
        <h2>Records Clean RM</h2>
        <p class="records-subtitle">Los 3 atletas que mas libras levantaron en Clean de todas las categorias.</p>
        <div id="recordsContent"></div>
      </div>
    </div>`;

  renderRecordsClean();
}

function mostrarCompetencia(){

  const seleccion=competenciaSelect.value;
  categoriaActual = seleccion;
  const filtro=filtros[seleccion];
  if(!filtro){ tablas.innerHTML=""; return; }

  const recordsActuales = obtenerRecords();
  const atletas=datos.pruebaIndividual.ATLETAS
  .filter(a=>a.categoria===filtro.categoria && (filtro.rama==="Mixto" || a.rama===filtro.rama))
  .map(a=>({...a,total:a.resultados.reduce((s,x)=>s+x.puntos,0)}))
  .sort((a,b)=>b.total-a.total);

  let html=`<div class="category">${filtro.categoria} - ${filtro.rama}</div>
  <table><tr><th>#</th><th>Atleta</th><th>Total</th></tr>`;

  atletas.forEach((a,i)=>{

    let clase="";
    if(i===0)clase="gold";
    else if(i===1)clase="silver";
    else if(i===2)clase="bronze";

    let lugar=i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1;

    const recordBadge = atletaTieneRecord(a, recordsActuales) ? ` <span class="record-badge">🏆 RECORD</span>` : "";
    html+=`<tr class="${clase}" onclick='verAtleta(${JSON.stringify(a)},${i})'>
    <td>${lugar}</td><td>${nombreAtletaMarkup(a, recordBadge)}</td><td>${a.total}</td></tr>`;
  });

  html+="</table>";
  tablas.innerHTML=html;
}

function verAtleta(a,lugar){

  if(lugar<3){
    lanzarConfetiDesdeElemento(buscarNombreRecord(a.nombre), 150);
  }

  let html = `
  <div class="modal-bg" onclick="cerrarModal()">
  <div class="modal grande" onclick="event.stopPropagation()">
  <button class="close-btn" onclick="cerrarModal()">×</button>

  <h2>${a.nombre}</h2>
  <p><strong>Categoría:</strong> ${a.categoria}</p>
  <p><strong>Rama:</strong> ${a.rama}</p>
  <p><strong>Heat:</strong> ${a.heat}</p>
  <p><strong>Carril:</strong> ${a.carril}</p>

  <h3 style="margin-top:15px;">WODs</h3>
  `;

  a.resultados.forEach((r,i)=>{

    html += `
      <div class="wod-card">
        <div class="wod-header" onclick="toggleWod(${i})">
         ${r.wod} <span id="arrow_${i}">▼</span>
        </div>

        <div class="wod-body" id="wod_${i}">
    `;

    if(r.timeCap) html += `<p>⏱ Time Cap: ${r.timeCap}</p>`;
    if(r.tiempo) html += `<p>⏱ Tiempo: ${r.tiempo}</p>`;
    if(r.rondas || r.reps){
      html += `<p>🔁 ${r.rondas||0} rondas ${r.reps||0} reps</p>`;
    }
    if(r.peso) html += `<p>🏋️ ${r.peso} lb</p>`;
    if(r.tiebreak) html += `<p>⚖️ Tiebreak: ${r.tiebreak}</p>`;

    html += `<p>⭐ ${r.puntos} pts</p>`;

    html += `</div></div>`;
  });

  html += `
    <hr>
    <p><strong>Total:</strong> ${a.resultados.reduce((s,x)=>s+x.puntos,0)}</p>
  </div></div>
  `;

  document.getElementById("modalContainer").innerHTML = html;
}

function cerrarModal(){
  modalContainer.innerHTML="";
}
function toggleWod(i){

  const el = document.getElementById("wod_"+i);
  const arrow = document.getElementById("arrow_"+i);
  const yaAbierto = el.classList.contains("activo");

  // cerrar todos
  document.querySelectorAll(".wod-body").forEach((el2, index)=>{
    el2.classList.remove("activo");
    const a = document.getElementById("arrow_"+index);
    if(a) a.style.transform = "rotate(0deg)";
  });

  // si no estaba abierto, lo abrimos
  if(!yaAbierto){
    el.classList.add("activo");
    arrow.style.transform = "rotate(180deg)";
  }
}
function volverCompetencias(){
  window.location.href = "index.html";
}

function refrescarPagina(){
  window.location.reload();
}
