<title>WODStar Scores PRO</title>

<style>
:root{
  --primary:#000;
  --accent:#FFD700;
  --light:#f5f5f5;
  --dark:#111;
  --row:#1a1a1a;
}

/* BASE */
body{
  background:var(--primary);
  color:var(--light);
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  padding:2rem;
}

h1{
  color:var(--accent);
  font-size:2.5rem;
  letter-spacing:3px;
  margin-bottom:1rem;
}

/* CONTROLES */
select,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  font-size:1rem;
}

button{
  background:var(--accent);
  color:black;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

/* TABLA */
table{
  width:100%;
  max-width:1000px;
  margin-top:1rem;
  border-collapse:collapse;
  background:var(--dark);
  border-radius:1rem;
  overflow:hidden;
}

th{
  background:black;
  color:var(--accent);
  font-size:1.1rem;
  padding:15px;
}

td{
  padding:18px;
  font-size:1.1rem;
}

tr:nth-child(even){
  background:var(--row);
}

tr:hover{
  background:#222;
  cursor:pointer;
}

/* 🥇🥈🥉 TOP 3 */
.gold{
  background:linear-gradient(90deg,#FFD70033,#FFD70011);
  box-shadow:0 0 15px #FFD70066;
  font-weight:bold;
}

.silver{
  background:linear-gradient(90deg,#C0C0C033,#C0C0C011);
}

.bronze{
  background:linear-gradient(90deg,#cd7f3233,#cd7f3211);
}

/* GLOW ANIMADO */
@keyframes glow{
  0%{box-shadow:0 0 5px #FFD700;}
  50%{box-shadow:0 0 20px #FFD700;}
  100%{box-shadow:0 0 5px #FFD700;}
}

.gold{
  animation:glow 2s infinite;
}

/* CATEGORIA */
.category{
  margin-top:2rem;
  color:var(--accent);
  font-size:1.8rem;
}

/* MODAL */
.modal-bg{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.modal{

width:90%;

max-width:900px;


max-height:90vh;


overflow-y:auto;

}

.modal h2{
  color:var(--accent);
}

.modal p{
  border-left:3px solid var(--accent);
  padding-left:10px;
}

.close-btn{
  position:absolute;
  right:15px;
  top:10px;
  font-size:1.5rem;
  background:none;
  border:none;
  color:var(--accent);
}

/* 📺 MODO PANTALLA GRANDE */
@media(min-width:1200px){
  body{font-size:1.3rem;}
  td{padding:22px;}
}
/* MODAL GRANDE */
.modal.grande{
  width:95%;
  max-width:900px;
  max-height:90vh;
  overflow-y:auto;
}

/* WOD CARDS */
.wod-card{
  margin-top:10px;
  border:1px solid #333;
  border-radius:8px;
  overflow:hidden;
}

.wod-header{
  background:#FFD700;
  color:black;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}

.wod-body{
  max-height: 0;
  overflow: hidden;
  transition: all 0.4s ease;
  padding: 0 10px;
  background:#1a1a1a;
  opacity: 0;
}

/* cuando está abierto */
.wod-body.activo{
  max-height: 300px;
  padding: 10px;
  opacity: 1;
}
.wod-header{
  background:#FFD700;
  color:black;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.3s;
}

.wod-header:hover{
  background:#ffcc00;
}
.top-actions{
  width:100%;
  max-width:1000px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 auto 1rem auto;
  gap:10px;
}

.top-actions button{
  min-width:140px;
}

@media(max-width:600px){
  .top-actions{
    flex-direction:column;
  }

  .top-actions button{
    width:100%;
  }
}

.estado-competencia{
    text-align:center;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
    font-size:18px;
    margin-bottom:15px;
    background:#222;
    color:white;
}

.competencia-hero{
  width:100%;
  max-width:1000px;
  margin:0 auto 1.25rem;
  padding:18px;
  border:1px solid #333;
  border-radius:14px;
  background:linear-gradient(145deg,#141414,#050505);
  box-shadow:0 0 18px #FFD70022;
}

.competencia-hero h1{
  margin:0 0 14px;
}

.highlights-link{
  display:inline-block;
  padding:12px 18px;
  border-radius:10px;
  background:var(--accent);
  color:black;
  font-weight:bold;
  text-decoration:none;
  transition:transform .2s ease, box-shadow .2s ease;
}

.highlights-link:hover{
  transform:translateY(-2px);
  box-shadow:0 0 22px #FFD70088;
}

.highlights-link small{
  display:block;
  margin-top:3px;
  font-weight:600;
}

@media(max-width:600px){
  .competencia-hero{
    padding:16px 12px;
  }

  .highlights-link{
    width:100%;
    box-sizing:border-box;
  }
}


/* MENSAJES EMERGENTES */
.toast-stack{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
  width:min(360px, calc(100vw - 28px));
  pointer-events:none;
}

.toast-message{
  background:linear-gradient(145deg,#151515,#050505);
  border:1px solid #FFD700;
  border-left:6px solid #FFD700;
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.45), 0 0 20px #FFD70022;
  color:#f5f5f5;
  padding:14px 16px;
  text-align:left;
  animation:toastIn .35s ease forwards;
  pointer-events:auto;
}

.toast-message.saliendo{
  animation:toastOut .35s ease forwards;
}

.toast-title{
  color:#FFD700;
  display:block;
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:4px;
  text-transform:uppercase;
}

.toast-message p{
  border:0;
  margin:0;
  padding:0;
  line-height:1.35;
}

@keyframes toastIn{
  from{opacity:0; transform:translateY(14px) scale(.98);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

@keyframes toastOut{
  from{opacity:1; transform:translateY(0) scale(1);}
  to{opacity:0; transform:translateY(14px) scale(.98);}
}

@media(max-width:700px){
  .toast-stack{
    left:14px;
    right:14px;
    bottom:14px;
    width:auto;
  }
}

.top-actions{

}

.top-actions button{

  color:#FFD700;
  font-size:.9rem;
  box-shadow:none;

.top-actions button:hover{
  background:#1b1b1b;

.competencia-hero{

.competencia-hero h1{

}

.score-controls{
  align-items:center;

  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin:0 auto 18px;

.category-select{

  border:2px solid #FFD700;
  color:#111;
  font-weight:700;
  min-height:44px;
}

.secondary-actions{
  align-items:center;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin:0 auto 18px;
  max-width:760px;
}

.secondary-actions button,
.secondary-actions .highlights-link{
  align-items:center;

  font-size:.9rem;
  font-weight:800;
  justify-content:center;
  min-height:38px;
  padding:8px 13px;
  text-decoration:none;
  width:auto;
}

.secondary-actions button:hover,
.secondary-actions .highlights-link:hover{
  background:#202020;
  box-shadow:0 0 14px #FFD70022;
  transform:translateY(-1px);
}

.highlights-link small{
  display:none;
}

.photo-modal{
  background:linear-gradient(145deg,#151515,#050505);
  border:1px solid #3a3a3a;
  border-top:4px solid #FFD700;
  box-shadow:0 22px 60px rgba(0,0,0,.6), 0 0 28px #FFD70022;
  padding:24px;
  text-align:left;
}

.photo-modal h2{
  margin-top:0;
  text-align:center;
}

.photo-form{
  display:grid;
  gap:12px;
}

.photo-form label{
  color:#FFD700;
  display:grid;
  font-size:.9rem;
  font-weight:800;
  gap:6px;
}

.photo-form input,
.photo-form select{
  background:#f5f5f5;
  border:2px solid transparent;
  border-radius:8px;
  color:#111;
  font:inherit;
  margin:0;
  min-height:44px;
  padding:10px;
  width:100%;
}

.photo-form input:focus,
.photo-form select:focus{
  border-color:#FFD700;
  outline:none;
}

.photo-status,
.photo-notice{
  background:#1a1a1a;
  border:1px solid #333;
  border-left:4px solid #FFD700;
  border-radius:10px;
  color:#f5f5f5;
  line-height:1.45;
  margin:8px 0 0;
  padding:12px;
}

.photo-notice strong{
  color:#FFD700;
}

.photo-deadline{
  background:#221a05;
  border:1px solid #FFD700;
  border-radius:10px;
  color:#FFD700;
  font-weight:900;
  line-height:1.4;
  margin:2px 0 0;
  padding:12px;
  text-align:center;
}

.photo-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:8px;
}

.photo-actions button{
  min-height:42px;
}

.photo-help-link{
  align-items:center;
  background:#25d366;
  border-radius:999px;
  color:#07150b;
  display:inline-flex;
  font-weight:900;
  justify-content:center;
  min-height:42px;
  padding:10px 14px;
  text-decoration:none;
}

.photo-help-link:hover{
  box-shadow:0 0 18px rgba(37,211,102,.35);
  transform:translateY(-1px);
}

.athlete-with-photo{
  align-items:center;
  display:inline-flex;
  gap:10px;
  justify-content:center;
}

.athlete-avatar{
  border:2px solid #FFD700;
  border-radius:50%;
  box-shadow:0 0 14px #FFD70044;
  flex:0 0 auto;
  height:44px;
  object-fit:cover;
  width:44px;
}

.athlete-modal-photo{
  border:3px solid #FFD700;
  border-radius:50%;
  box-shadow:0 0 24px #FFD70055;
  display:block;
  height:118px;
  margin:0 auto 14px;
  object-fit:cover;
  width:118px;
}

@media(max-width:600px){

    padding:1rem;
  }

  }

  .top-actions button{
    width:auto;
    flex:0 1 auto;
  }

  .competencia-hero{
    padding:16px 10px;
  }

  .score-controls,
  .secondary-actions{
    gap:8px;
  }

  .secondary-actions button,
  .secondary-actions .highlights-link{
    flex:1 1 145px;
    box-sizing:border-box;
  }

  .athlete-with-photo{
    justify-content:flex-start;
  }

  .athlete-avatar{
    height:38px;
    width:38px;
  }

}

    x:(rect.left + rect.width/2) / window.innerWidth,
    y:(rect.top + rect.height/2) / window.innerHeight
  } : {x:.5,y:.72};

  confetti({particleCount:intensidad, spread:75, origin:origen});
}

function buscarNombreRecord(nombre){
  return [...document.querySelectorAll("[data-record-name]")].find(el=>el.dataset.recordName===nombre);
}

function crearMensajeEmergente(titulo, mensaje, duracion=6500, opciones={}){
  const stack = document.getElementById("toastStack");
  if(!stack)return;

  const aviso = document.createElement("div");
  aviso.className = `toast-message${opciones.tipo==="record" ? " toast-record" : ""}`;
  aviso.innerHTML = `<span class="toast-title">${titulo}</span><p>${mensaje}</p>${opciones.accion ? `<span class="toast-hint">${opciones.accion}</span>` : ""}`;

  if(opciones.onClick){
    aviso.setAttribute("role","button");
    aviso.tabIndex = 0;
    aviso.addEventListener("click", opciones.onClick);
    aviso.addEventListener("keydown", (event)=>{
      if(event.key==="Enter" || event.key===" "){
        event.preventDefault();
        opciones.onClick();
      }
    });
  }

  stack.appendChild(aviso);

  if(opciones.confetti){
    const objetivo = opciones.confettiName ? buscarNombreRecord(opciones.confettiName) : aviso.querySelector(".toast-title");
    lanzarConfetiDesdeElemento(objetivo || aviso.querySelector(".toast-title"), 80);
  }

  setTimeout(()=>{
    aviso.classList.add("saliendo");
    setTimeout(()=>aviso.remove(), 350);
  }, duracion);
}

function segundosDesdeTiempo(valor){
  if(!valor)return null;
  const texto = String(valor).trim();
  const partes = texto.split(":").map(n=>Number(n));
  if(partes.some(n=>Number.isNaN(n)))return null;
  if(partes.length===2)return partes[0]*60 + partes[1];
  if(partes.length===3)return partes[0]*3600 + partes[1]*60 + partes[2];
  return null;
}

function numeroDesdePeso(valor){
  if(valor===undefined || valor===null)return null;
  const numero = Number(String(valor).replace(/[^0-9.]/g,""));
  return Number.isFinite(numero) && numero>0 ? numero : null;
}

function textoSeguro(valor){
  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function fotoAprobada(atleta){
  return atleta?.fotoEstado==="aprobada" && Boolean(atleta.fotoUrl);
}

function nombreAtletaMarkup(atleta, extraHtml=""){
  const nombre = textoSeguro(atleta.nombre);
  const dataName = textoSeguro(atleta.nombre);

  if(!fotoAprobada(atleta)){
    return `<span class="record-name" data-record-name="${dataName}">${nombre}${extraHtml}</span>`;
  }

  return `<span class="record-name athlete-with-photo" data-record-name="${dataName}">
    <img class="athlete-avatar" src="${textoSeguro(atleta.fotoUrl)}" alt="Foto de ${nombre}" loading="lazy">
    <span>${nombre}${extraHtml}</span>
  </span>`;
}

function actualizarContadorFoto(){
  const elemento = document.getElementById("photoDeadline");
  if(!elemento)return;

  const fechaLimite = new Date("2026-07-15T23:59:59");

  function pintar(){
    const restante = fechaLimite.getTime() - Date.now();
    if(restante <= 0){
      elemento.textContent = "La fecha límite para enviar foto fue el 15 de julio de 2026.";
      return;
    }

    const dias = Math.floor(restante / 86400000);
    const horas = Math.floor((restante % 86400000) / 3600000);
    const minutos = Math.floor((restante % 3600000) / 60000);
    elemento.textContent = `Fecha límite: 15 de julio de 2026. Quedan ${dias} días, ${horas} horas y ${minutos} minutos.`;
  }

  pintar();
  clearInterval(window.photoDeadlineTimer);
  window.photoDeadlineTimer = setInterval(pintar, 60000);
}

function obtenerRecords(){
  const records = [];

  datos.pruebaIndividual.ATLETAS.forEach(atleta=>{
    const clean = atleta.resultados.find(resultado=>resultado.wod==="WOD 2");
    if(!clean)return;

    const peso = numeroDesdePeso(clean.peso);
    if(peso===null)return;

    records.push({atleta, resultado:clean, marca:peso});
  });

  return records.sort((a,b)=>b.marca-a.marca).slice(0,3);
}

function obtenerRecordDestacado(records){
  const record = records[0];
  if(!record)return null;

  return {

    record
  };
}

function atletaTieneRecord(atleta, records){
  return Boolean(records[0] && records[0].atleta.nombre===atleta.nombre);
}

function filaRecord(record, index){
  const lugar = index===0 ? "1" : index===1 ? "2" : "3";
  const badge = index===0 ? ` <span class="record-badge">🏆 RECORD</span>` : "";

  return `<tr>
    <td><strong>${lugar}</strong></td>
    <td>${nombreAtletaMarkup(record.atleta, badge)}</td>
    <td>${textoSeguro(record.atleta.categoria)} ${textoSeguro(record.atleta.rama)}</td>
    <td><strong>${textoSeguro(record.marca)} lb</strong></td>
  </tr>`;
}

function renderRecordsClean(){
  const records = obtenerRecords();

  contenedor.innerHTML = `<div class="records-card">

  if(lugar<3){
    lanzarConfetiDesdeElemento(buscarNombreRecord(a.nombre), 150);
  }

  let html = `
  <div class="modal-bg" onclick="cerrarModal()">
  <div class="modal grande" onclick="event.stopPropagation()">
  <button class="close-btn" onclick="cerrarModal()">×</button>

  ${fotoAprobada(a) ? `<img class="athlete-modal-photo" src="${textoSeguro(a.fotoUrl)}" alt="Foto de ${textoSeguro(a.nombre)}">` : ""}
  <h2>${a.nombre}</h2>
  <p><strong>Categoría:</strong> ${a.categoria}</p>
  <p><strong>Rama:</strong> ${a.rama}</p>
  <p><strong>Heat:</strong> ${a.heat}</p>
  <p><strong>Carril:</strong> ${a.carril}</p>

  <h3 style="margin-top:15px;">WODs</h3>
  `;

  a.resultados.forEach((r,i)=>{

    html += `
      <div class="wod-card">
        <div class="wod-header" onclick="toggleWod(${i})">
         ${r.wod} <span id="arrow_${i}">▼</span>
        </div>

        <div class="wod-body" id="wod_${i}">
    `;

    if(r.timeCap) html += `<p>⏱ Time Cap: ${r.timeCap}</p>`;
    if(r.tiempo) html += `<p>⏱ Tiempo: ${r.tiempo}</p>`;
    if(r.rondas || r.reps){
      html += `<p>🔁 ${r.rondas||0} rondas ${r.reps||0} reps</p>`;
    }
    if(r.peso) html += `<p>🏋️ ${r.peso} lb</p>`;
    if(r.tiebreak) html += `<p>⚖️ Tiebreak: ${r.tiebreak}</p>`;

    html += `<p>⭐ ${r.puntos} pts</p>`;

    html += `</div></div>`;
  });

  html += `
    <hr>
    <p><strong>Total:</strong> ${a.resultados.reduce((s,x)=>s+x.puntos,0)}</p>
  </div></div>
  `;

  document.getElementById("modalContainer").innerHTML = html;
}

function toggleWod(i){

  const el = document.getElementById("wod_"+i);
  const arrow = document.getElementById("arrow_"+i);
  const yaAbierto = el.classList.contains("activo");

  // cerrar todos
  document.querySelectorAll(".wod-body").forEach((el2, index)=>{
    el2.classList.remove("activo");
    const a = document.getElementById("arrow_"+index);
    if(a) a.style.transform = "rotate(0deg)";
  });

  // si no estaba abierto, lo abrimos
  if(!yaAbierto){
    el.classList.add("activo");
    arrow.style.transform = "rotate(180deg)";
  }
}
