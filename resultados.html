<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>WODSTARS · Resultados en vivo</title><style>:root{font-family:Segoe UI,system-ui,sans-serif;background:#080808;color:#fff;--gold:#ffd400}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}h1,h2{color:var(--gold)}.card{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin-bottom:18px}select{padding:10px;background:#0d0d0d;color:#fff;border:1px solid #555;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #333}th{color:var(--gold)}.muted{color:#aaa}.status{padding:10px;background:#222;border-radius:8px}.live{color:#8ef0b2}.table-wrap{overflow:auto}</style></head><body><main><h1>WODSTARS · Resultados en vivo</h1><p class="muted">Los resultados aparecen automáticamente cuando el staff los envía.</p><section class="card"><label>Competencia <select id="event"></select></label><label>WOD <select id="wod"><option value="1">WOD 1</option><option value="2">WOD 2</option><option value="3">WOD 3</option></select></label><div id="status" class="status">Cargando…</div></section><section id="results" class="card"></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm";const db=createClient("https://frabmnxuaypxodtgpzzj.supabase.co","sb_publishable_DK1mCrP-0M-n8FRs4RraCA_pDQ-RY0A"),$=id=>document.getElementById(id);let events=[];async function loadEvents(){const{data,error}=await db.from('competition_events').select('*').eq('status','published').order('created_at',{ascending:false});if(error)throw error;events=data||[];$('event').innerHTML=events.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');await loadResults()}async function loadResults(){const id=$('event').value,wod=Number($('wod').value);if(!id){$('results').innerHTML='<p class="muted">No hay competencias publicadas.</p>';return}const{data,error}=await db.from('competition_scores').select('*,competition_athletes(name,box,heat,lane),competition_categories(name)').eq('event_id',id).eq('wod_number',wod).order('category_id').order('athlete_id');if(error){$('status').textContent=error.message;return}const rows=data||[];$('status').innerHTML=`<span class="live">● EN VIVO</span> · ${rows.length} resultados publicados`;$('results').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Categoría</th><th>Heat</th><th>Carril</th><th>Atleta</th><th>Rondas</th><th>Reps</th><th>Tiempo</th><th>Kg</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.competition_categories?.name||''}</td><td>${r.competition_athletes?.heat||''}</td><td>${r.competition_athletes?.lane||''}</td><td>${r.competition_athletes?.name||''}</td><td>${r.rounds??''}</td><td>${r.reps??''}</td><td>${r.time_seconds??''}</td><td>${r.weight_kg??''}</td></tr>`).join('')}</tbody></table></div>`}$('event').addEventListener('change',loadResults);$('wod').addEventListener('change',loadResults);loadEvents();db.channel('competition-score-live').on('postgres_changes',{event:'*',schema:'public',table:'competition_scores'},loadResults).subscribe();</script></body></html>
